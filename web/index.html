<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1830" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Arcaea B50</title>
  </head>
  <body>
    <header class="top">
      <div>
        <div class="label">POTENTIAL</div>
        <div id="total" class="total">-</div>
      </div>
      <label class="add-btn">
        スクショを追加
        <input id="file" type="file" accept="image/*" multiple hidden />
      </label>
    </header>

    <main>
      <section id="drop" class="drop" hidden>ここにドロップ</section>
      <section>
        <h2 id="results-title" hidden>登録結果</h2>
        <div id="results"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>Best 50</h2>
          <button id="make-image" class="secondary">ベスト枠画像を作る</button>
        </div>
        <div id="image-box" class="image-box" hidden>
          <label class="name-field">プレイヤー名 <input id="player-name" maxlength="20" placeholder="PLAYER" /></label>
          <img id="image-preview" alt="ベスト枠画像" />
          <div class="buttons">
            <button id="share-image">共有</button>
            <button id="save-image" class="secondary">画像を保存</button>
            <button id="close-image" class="secondary">閉じる</button>
          </div>
        </div>
        <p id="empty" class="muted" hidden>
          記録がありません。リザルト画面のスクショを追加するか、設定からバックアップを読み込んでください。
        </p>
        <div class="table-wrap">
          <table id="b50">
            <tbody></tbody>
          </table>
        </div>
      </section>

      <details class="settings">
        <summary>設定・データ</summary>
        <p class="muted" id="stats"></p>
        <div class="buttons">
          <button id="export">バックアップを書き出す</button>
          <label class="button">
            バックアップを読み込む
            <input id="import" type="file" accept="application/json,.json" hidden />
          </label>
          <button id="wipe" class="danger">全データを削除</button>
        </div>
        <p class="muted small">
          記録はこのブラウザの中だけに保存されます。機種変更やブラウザのデータ削除に備えて、ときどきバックアップを書き出してください。
        </p>
      </details>
    </main>
    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
